<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NearPath Tutors — Find the right teacher, close to home</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#0A0E27;
  --bg2:#12163a;
  --glass: rgba(255,255,255,0.055);
  --glass-hi: rgba(255,255,255,0.09);
  --glass-border: rgba(255,255,255,0.14);
  --text:#F4F2FF;
  --text-dim:#9C97C4;
  --text-dimmer:#716C99;
  --primary:#6C5CE7;
  --primary2:#EC4899;
  --amber:#F5A623;
  --green:#2ECC71;
  --blue:#4FA8F5;
  --pink:#F472B6;
  --red:#FB6A6A;
  --radius:20px;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Fraunces', serif;
  --body: 'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
::selection{ background: var(--primary); color:#fff; }
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:10px; }

/* ---------- floating gradient blobs ---------- */
.blobs{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; filter: blur(90px); opacity:0.45; }
.blob1{ width:520px; height:520px; background: radial-gradient(circle, var(--primary), transparent 70%); top:-160px; left:-120px; animation: float1 22s ease-in-out infinite; }
.blob2{ width:460px; height:460px; background: radial-gradient(circle, var(--primary2), transparent 70%); top:20%; right:-160px; animation: float2 26s ease-in-out infinite; }
.blob3{ width:380px; height:380px; background: radial-gradient(circle, var(--blue), transparent 70%); bottom:-140px; left:20%; animation: float3 20s ease-in-out infinite; }
.blob4{ width:300px; height:300px; background: radial-gradient(circle, var(--amber), transparent 70%); bottom:10%; right:15%; opacity:0.28; animation: float1 30s ease-in-out infinite reverse; }
@keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(60px,80px) scale(1.1);} }
@keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-70px,60px) scale(0.9);} }
@keyframes float3{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(50px,-60px) scale(1.15);} }

#app{ position:relative; z-index:1; min-height:100vh; }

/* ---------- utility ---------- */
.wrap{ max-width:1240px; margin:0 auto; padding:0 28px; }
.glass{
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: var(--radius);
}
.glass:hover{ background: var(--glass-hi); }
h1,h2,h3,h4{ font-family: var(--display); font-weight:600; letter-spacing:-0.01em; }
.eyebrow{ font-family: var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color: var(--text-dim); }
.muted{ color: var(--text-dim); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family: var(--body); font-weight:600; font-size:14.5px;
  padding:13px 24px; border-radius:100px; border:none; cursor:pointer;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s ease, background .25s ease;
  white-space:nowrap;
}
.btn:active{ transform: scale(0.96); }
.btn-primary{ background: linear-gradient(135deg, var(--primary), var(--primary2)); color:#fff; box-shadow: 0 8px 24px -8px rgba(108,92,231,0.7); }
.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(108,92,231,0.85); }
.btn-ghost{ background: var(--glass); border:1px solid var(--glass-border); color:var(--text); }
.btn-ghost:hover{ background: var(--glass-hi); transform: translateY(-2px); }
.btn-sm{ padding:9px 16px; font-size:13px; }
.btn-block{ width:100%; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--glass-border); background:var(--glass); cursor:pointer; transition: all .2s ease; white-space:nowrap;}
.pill:hover{ background: var(--glass-hi); transform: translateY(-1px); }
.pill.active{ background: linear-gradient(135deg, var(--primary), var(--primary2)); border-color:transparent; color:#fff; }
.input{
  width:100%; background: rgba(255,255,255,0.05); border:1px solid var(--glass-border);
  color:var(--text); padding:13px 16px; border-radius:12px; font-family:var(--body); font-size:14px; outline:none;
  transition: border-color .2s ease, background .2s ease;
}
.input:focus{ border-color: var(--primary); background: rgba(255,255,255,0.08); }
.input::placeholder{ color: var(--text-dimmer); }
label.field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; font-family:var(--mono); letter-spacing:0.03em; }
.field{ margin-bottom:16px; }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700; font-family:var(--mono); letter-spacing:0.02em; }
.badge-green{ background: rgba(46,204,113,0.15); color: var(--green); }
.badge-amber{ background: rgba(245,166,35,0.15); color: var(--amber); }
.badge-red{ background: rgba(251,106,106,0.15); color: var(--red); }
.badge-blue{ background: rgba(79,168,245,0.15); color: var(--blue); }
.card{ transition: transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s ease; }
.card:hover{ transform: translateY(-6px); box-shadow: 0 20px 40px -16px rgba(0,0,0,0.5); }
.fade-in{ animation: fadeIn .5s ease both; }
@keyframes fadeIn{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:translateY(0);} }
.stagger > *{ animation: fadeIn .5s ease both; }
.stagger > *:nth-child(1){ animation-delay: .02s;} .stagger > *:nth-child(2){ animation-delay: .06s;}
.stagger > *:nth-child(3){ animation-delay: .10s;} .stagger > *:nth-child(4){ animation-delay: .14s;}
.stagger > *:nth-child(5){ animation-delay: .18s;} .stagger > *:nth-child(6){ animation-delay: .22s;}
.stagger > *:nth-child(7){ animation-delay: .26s;} .stagger > *:nth-child(8){ animation-delay: .30s;}
.view-transition{ animation: viewIn .45s cubic-bezier(.2,.9,.3,1) both; }
@keyframes viewIn{ from{ opacity:0; transform: translateY(18px) scale(0.99);} to{ opacity:1; transform:translateY(0) scale(1);} }
a{ color:inherit; text-decoration:none; }
.stars{ display:inline-flex; gap:2px; color: var(--amber); font-size:14px; letter-spacing:1px; }
.divider-dashed{ border:none; border-top:2px dashed rgba(255,255,255,0.15); margin:0; }
.avatar{ border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; flex-shrink:0; color:#fff; }
.scroll-x{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.scroll-x::-webkit-scrollbar{ display:none; }
.grid-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:20px; }
.toast-wrap{ position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px; }
.toast{ padding:14px 20px; border-radius:14px; font-size:14px; font-weight:600; min-width:260px; animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2) both; display:flex; align-items:center; gap:10px;}
@keyframes toastIn{ from{ opacity:0; transform: translateX(40px);} to{ opacity:1; transform:translateX(0);} }
.modal-backdrop{ position:fixed; inset:0; background:rgba(5,6,20,0.68); backdrop-filter: blur(6px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; animation: fadeIn .25s ease both; }
.modal{ width:100%; max-width:460px; max-height:88vh; overflow-y:auto; animation: modalIn .35s cubic-bezier(.2,.9,.3,1.15) both; padding:28px; }
@keyframes modalIn{ from{ opacity:0; transform: translateY(30px) scale(0.96);} to{ opacity:1; transform:translateY(0) scale(1);} }

/* ticket / class-slip signature element */
.ticket{
  position:relative; display:flex; align-items:stretch; border-radius:16px; overflow:hidden;
  background: var(--glass); border:1px solid var(--glass-border);
}
.ticket-stub{ width:86px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); position:relative; }
.ticket-stub .t-day{ font-size:11px; letter-spacing:0.08em; opacity:0.85; }
.ticket-stub .t-time{ font-size:13px; font-weight:700; margin-top:4px; text-align:center; }
.ticket-perf{ width:0; border-left:2px dashed rgba(255,255,255,0.25); position:relative; }
.ticket-perf::before, .ticket-perf::after{ content:''; position:absolute; width:14px; height:14px; background:var(--bg); border-radius:50%; left:-8px; }
.ticket-perf::before{ top:-7px; } .ticket-perf::after{ bottom:-7px; }
.ticket-body{ flex:1; padding:14px 18px; }

/* navbar */
.nav{ position:sticky; top:0; z-index:100; padding:16px 0; }
.nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; }
.logo{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:19px; }
.logo-mark{ width:34px; height:34px; border-radius:10px; background: linear-gradient(135deg, var(--primary), var(--primary2)); display:flex; align-items:center; justify-content:center; font-size:16px; }
.nav-links{ display:flex; gap:4px; align-items:center; }
.nav-links a, .nav-links button{ background:none; border:none; color:var(--text-dim); font-weight:600; font-size:14px; padding:9px 14px; border-radius:100px; cursor:pointer; transition: all .2s ease; font-family:var(--body); }
.nav-links a:hover, .nav-links button:hover{ color:var(--text); background: var(--glass); }

/* calendar */
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; }
.cal-head{ font-family:var(--mono); font-size:11px; text-align:center; color:var(--text-dimmer); padding-bottom:4px; }
.cal-cell{ aspect-ratio:1; border-radius:10px; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; position:relative; }
.cal-cell.has-class{ background: rgba(108,92,231,0.18); border-color: rgba(108,92,231,0.4); }
.cal-cell .dot{ width:5px; height:5px; border-radius:50%; background: var(--primary2); position:absolute; bottom:5px; }

table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.data-table th{ text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dimmer); padding:10px 12px; border-bottom:1px solid var(--glass-border); }
table.data-table td{ padding:12px; border-bottom:1px solid rgba(255,255,255,0.05); }
table.data-table tr:hover td{ background: rgba(255,255,255,0.02); }

.sidebar-link{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; color:var(--text-dim); font-weight:600; font-size:14px; cursor:pointer; transition: all .2s ease; }
.sidebar-link:hover{ background: var(--glass); color:var(--text); }
.sidebar-link.active{ background: linear-gradient(135deg, rgba(108,92,231,0.25), rgba(236,73,153,0.2)); color:#fff; border:1px solid rgba(108,92,231,0.4); }

.stat-card{ padding:20px; }
.stat-num{ font-family:var(--display); font-size:32px; font-weight:600; margin-top:4px; }

@media(max-width:860px){
  .nav-links{ display:none; }
  .hide-mobile{ display:none; }
  .grid-2{ grid-template-columns:1fr !important; }
  .dash-layout{ grid-template-columns:1fr !important; }
}
.grid-2{ display:grid; grid-template-columns: 1.6fr 1fr; gap:24px; }
.dash-layout{ display:grid; grid-template-columns: 220px 1fr; gap:24px; align-items:start; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="blobs">
  <div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div><div class="blob blob4"></div>
</div>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Supabase client library (auth + database) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   SUPABASE CONFIG — fill these in from your Supabase project
   (Project Settings → API). See README.md for step-by-step setup.
========================================================= */
const SUPABASE_URL = 'https://lchjmorojcuiawetgtqf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjaGptb3JvamN1aWF3ZXRndHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzA3NDcsImV4cCI6MjEwMDgwNjc0N30.IN0yTTBfYNfCoJF2AKgY-PKmqBb_mf6J-ku8HvxxrsY';
const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
</script>

<script>
/* =========================================================
   DATA
========================================================= */
const CATS = [
  {id:'academics', label:'Academics', icon:'📘', color:'--blue'},
  {id:'sports', label:'Sports', icon:'⚽', color:'--green'},
  {id:'abacus', label:'Abacus & Math', icon:'🧮', color:'--amber'},
  {id:'music', label:'Music', icon:'🎵', color:'--pink'},
  {id:'dance', label:'Dance', icon:'💃', color:'--primary2'},
  {id:'coding', label:'Coding', icon:'💻', color:'--primary'},
  {id:'art', label:'Art & Craft', icon:'🎨', color:'--amber'},
];
const AVATAR_COLORS = ['#6C5CE7','#2ECC71','#F5A623','#F472B6','#EC4899','#4FA8F5','#FB6A6A'];

/* =========================================================
   STATE
========================================================= */
const state = {
  view: 'home',
  portal: 'customer', // customer | teacher
  session: null,       // supabase auth session, or null
  profile: null,        // row from `profiles` table for the signed-in user
  selectedTeacherId: null,
  filters: { category:'all', query:'', minRating:0, maxFee:3000 },
  teacherTab: 'overview',
  studentAuthMode: 'login',   // 'login' | 'signup'
  teacherAuthMode: 'login',
};

let TEACHERS = [];
let teachersStatus = 'idle'; // idle | loading | ready | error

let myEnrollments = [];
let myPayments = [];
let studentDataStatus = 'idle';

let myStudents = [];       // enrollments-as-students, for the logged-in teacher
let teacherDataStatus = 'idle';

function nav(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  window.scrollTo({top:0, behavior:'smooth'});
  if(view==='home' || view==='browse' || view==='teacherProfile') ensureTeachers();
  if(view==='studentDashboard') ensureStudentData();
  if(view==='teacherDashboard') ensureTeacherData();
  render();
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  const colors = {ok:'linear-gradient(135deg,#2ECC71,#27ae60)', info:'linear-gradient(135deg,#6C5CE7,#EC4899)', warn:'linear-gradient(135deg,#F5A623,#e67e22)', err:'linear-gradient(135deg,#FB6A6A,#c0392b)'};
  el.className = 'toast';
  el.style.background = colors[type||'info'];
  el.style.color = '#fff';
  el.innerHTML = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s ease, transform .4s ease'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),400); }, 3200);
}

function starString(rating){
  const full = Math.round(rating||0);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

/* =========================================================
   SUPABASE — AUTH
========================================================= */
function isConfigured(){ return !!sb; }

async function refreshProfile(){
  if(!state.session){ state.profile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(error){ console.error(error); state.profile = null; return; }
  state.profile = data;
}

async function boot(){
  if(!isConfigured()){ render(); return; }

  sb.auth.onAuthStateChange(async (_event, session)=>{
    state.session = session;
    await refreshProfile();
    // invalidate any per-user cached data so a different account doesn't see stale data
    studentDataStatus = 'idle'; teacherDataStatus = 'idle';
    render();
  });

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  await refreshProfile();

  // support ?teacher=<id> deep links (e.g. shared from a teacher's dashboard)
  const params = new URLSearchParams(location.search);
  const sharedTeacher = params.get('teacher');
  if(sharedTeacher){ state.view = 'teacherProfile'; state.selectedTeacherId = sharedTeacher; }

  ensureTeachers();
  render();
}

async function signUpStudent(name, email, password){
  if(!name || !email || !password) return toast('Please fill in all fields', 'warn');
  if(password.length < 6) return toast('Password must be at least 6 characters', 'warn');
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name, role:'student' } } });
  if(error) return toast('❌ ' + error.message, 'err');
  if(data.user){
    await sb.from('profiles').insert({ id:data.user.id, role:'student', full_name:name });
  }
  if(data.session){
    toast('🎉 Account created!', 'ok');
  }else{
    toast('✅ Account created — check your email to confirm, then log in.', 'ok');
    state.studentAuthMode = 'login';
    render();
  }
}

async function signInStudent(email, password){
  if(!email || !password) return toast('Please fill in all fields', 'warn');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return toast('❌ ' + error.message, 'err');
  toast('👋 Logged in successfully', 'ok');
}

async function signUpTeacher(name, email, password){
  if(!name || !email || !password) return toast('Please fill in all fields', 'warn');
  if(password.length < 6) return toast('Password must be at least 6 characters', 'warn');
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name, role:'teacher' } } });
  if(error) return toast('❌ ' + error.message, 'err');
  if(data.user){
    await sb.from('profiles').insert({ id:data.user.id, role:'teacher', full_name:name });
    await sb.from('teacher_profiles').insert({
      profile_id:data.user.id, initials: name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
      color: AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)], category:'academics',
      subjects:[], location:'', distance:'', fee_start:0, fee_unit:'/month', experience:'', bio:'',
    });
  }
  if(data.session){
    toast('🎉 Teacher account created — fill in your profile so students can find you.', 'ok');
  }else{
    toast('✅ Account created — check your email to confirm, then log in.', 'ok');
    state.teacherAuthMode = 'login';
    render();
  }
}

async function signInTeacher(email, password){
  if(!email || !password) return toast('Please fill in all fields', 'warn');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return toast('❌ ' + error.message, 'err');
  toast('👋 Welcome back', 'ok');
}

async function logout(){
  await sb.auth.signOut();
  nav(state.portal==='customer' ? 'home' : 'teacherHome');
}

/* =========================================================
   SUPABASE — DATA LOADERS
========================================================= */
async function ensureTeachers(force){
  if(teachersStatus==='ready' && !force) return;
  teachersStatus = 'loading';
  try{
    const { data, error } = await sb
      .from('teacher_profiles')
      .select('*, profiles(full_name), schedule_slots(day,time,subj)');
    if(error) throw error;
    TEACHERS = data.map(t=>({
      id: t.profile_id,
      name: t.profiles?.full_name || 'Unnamed teacher',
      initials: t.initials || '??',
      color: t.color || '#6C5CE7',
      category: t.category,
      subjects: t.subjects || [],
      location: t.location || 'Location not set',
      distance: t.distance || '—',
      rating: t.rating ?? 5,
      reviews: t.reviews ?? 0,
      feeStart: t.fee_start ?? 0,
      feeUnit: t.fee_unit || '/month',
      experience: t.experience || '—',
      bio: t.bio || 'This teacher hasn\'t written a bio yet.',
      schedule: t.schedule_slots || [],
      reviewList: [],
    }));
    teachersStatus = 'ready';
  }catch(err){
    console.error('Failed to load teachers', err);
    teachersStatus = 'error';
  }
  render();
}

async function ensureStudentData(force){
  if(!state.session || state.profile?.role!=='student') return;
  if(studentDataStatus==='ready' && !force) return;
  studentDataStatus = 'loading';
  try{
    const uid = state.session.user.id;
    const [{data:enrollments, error:e1}, {data:payments, error:e2}] = await Promise.all([
      sb.from('enrollments').select('*, teacher_profiles(profiles(full_name))').eq('student_id', uid).order('created_at',{ascending:false}),
      sb.from('payments').select('*').eq('student_id', uid).order('paid_at',{ascending:false}),
    ]);
    if(e1) throw e1; if(e2) throw e2;
    myEnrollments = enrollments.map(e=>({
      id:e.id, teacherId:e.teacher_id, teacherName: e.teacher_profiles?.profiles?.full_name || 'Teacher',
      subject:e.subject, schedule:e.schedule, fee:e.fee, status:e.status, dueDate:e.due_date || '—',
    }));
    myPayments = payments;
    studentDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load student dashboard data', err);
    studentDataStatus = 'error';
  }
  render();
}

async function ensureTeacherData(force){
  if(!state.session || state.profile?.role!=='teacher') return;
  if(teacherDataStatus==='ready' && !force) return;
  teacherDataStatus = 'loading';
  try{
    const uid = state.session.user.id;
    const { data, error } = await sb.from('enrollments').select('*, profiles(full_name)').eq('teacher_id', uid).order('created_at',{ascending:false});
    if(error) throw error;
    myStudents = data.map(e=>({
      enrollmentId:e.id, studentId:e.student_id, name: e.profiles?.full_name || 'Student',
      grade:e.grade || '—', subject:e.subject, feeStatus:e.status, fee:e.fee, schedule:e.schedule,
    }));
    teacherDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load teacher dashboard data', err);
    teacherDataStatus = 'error';
  }
  render();
}

function filteredTeachers(){
  const f = state.filters;
  return TEACHERS.filter(t=>{
    if(f.category!=='all' && t.category!==f.category) return false;
    if(f.query && !(t.name.toLowerCase().includes(f.query.toLowerCase()) || t.subjects.join(' ').toLowerCase().includes(f.query.toLowerCase()))) return false;
    if(t.rating < f.minRating) return false;

    return true;
  });
}

  <div class="wrap view-transition" style="padding-top:60px; display:flex; justify-content:center;">
    <div class="glass fade-in" style="padding:36px; width:100%; max-width:420px;">
      <div class="eyebrow">Teacher portal</div>
      <h2 style="font-size:24px; margin:8px 0 22px;">${mode==='login' ? 'Welcome back' : 'Register as a teacher'}</h2>
      ${mode==='signup' ? `<div class="field"><label class="field-label">Your name</label><input class="input" id="tuName" placeholder="Full name"/></div>` : ''}
      <div class="field"><label class="field-label">Email</label><input class="input" id="tuEmail" placeholder="you@example.com" type="email"/></div>
      <div class="field"><label class="field-label">Password</label><input class="input" id="tuPassword" placeholder="••••••••" type="password"/></div>
      <button class="btn btn-primary btn-block" data-action="${mode==='login'?'login-teacher':'signup-teacher'}">${mode==='login'?'Log in':'Create account'}</button>
      <p class="muted" style="text-align:center; font-size:13px; margin-top:16px;">
        ${mode==='login'
          ? `New here? <a style="color:var(--primary); font-weight:600;" data-action="teacher-auth-mode" data-mode="signup">Register as a teacher →</a>`
          : `Already have an account? <a style="color:var(--primary); font-weight:600;" data-action="teacher-auth-mode" data-mode="login">Log in →</a>`}
      </p>
    </div>
  </div>`;
}

function teacherSidebar(){
  const tabs = [
    {id:'overview', icon:'📊', label:'Overview'},
    {id:'students', icon:'👥', label:'Students'},
    {id:'profile', icon:'⚙️', label:'Profile'},
  ];
  return `<div class="glass" style="padding:14px;">
    ${tabs.map(t=>`<div class="sidebar-link ${state.teacherTab===t.id?'active':''}" data-action="teacher-tab" data-tab="${t.id}">${t.icon} ${t.label}</div>`).join('')}
    <hr class="divider-dashed" style="margin:10px 0;">
    <div class="sidebar-link" data-action="logout">🚪 Log out</div>
  </div>`;
}

function teacherOverview(){
  const pending = myStudents.filter(s=>s.feeStatus!=='paid').length;
  return `
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;" class="grid-2">
    <div class="glass stat-card"><div class="eyebrow">Total students</div><div class="stat-num">${myStudents.length}</div></div>
    <div class="glass stat-card"><div class="eyebrow">Pending payments</div><div class="stat-num" style="color:var(--amber)">${pending}</div></div>
    <div class="glass stat-card"><div class="eyebrow">Rating</div><div class="stat-num">${state.selectedTeacherProfile?.rating ?? '—'}</div></div>
  </div>
  <div class="glass" style="padding:22px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-size:15.5px;">Share your profile</h3>
      <button class="btn btn-ghost btn-sm" data-action="copy-profile-link">🔗 Copy link</button>
    </div>
    <p class="muted" style="font-size:13px;">Send parents a direct link to your profile so they can find and enroll with you.</p>
  </div>`;
}

function teacherStudents(){
  return `
  <div class="glass" style="padding:22px;">
    <h3 style="font-size:15.5px; margin-bottom:16px;">My students</h3>
    ${myStudents.length ? `<table class="data-table">
      <thead><tr><th>Name</th><th>Grade</th><th>Subject</th><th>Fee status</th><th>Fee</th></tr></thead>
      <tbody>
        ${myStudents.map(s=>`
        <tr>
          <td style="font-weight:600;">${s.name}</td>
          <td class="muted">${s.grade}</td>
          <td class="muted">${s.subject}</td>
          <td><span class="badge ${s.feeStatus==='paid'?'badge-green':s.feeStatus==='due'?'badge-amber':'badge-red'}">${s.feeStatus.toUpperCase()}</span></td>
          <td class="muted">₹${s.fee}</td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<p class="muted" style="font-size:13.5px;">No students enrolled yet. Share your profile link so parents can find you.</p>`}
  </div>`;
}

function teacherProfileEdit(){
  const t = state.selectedTeacherProfile || {};
  return `
  <div class="glass" style="padding:26px; max-width:560px;">
    <h3 style="font-size:15.5px; margin-bottom:18px;">Edit my profile</h3>
    <div class="field"><label class="field-label">Category</label>
      <select class="input" id="peCategory">
        ${CATS.map(c=>`<option value="${c.id}" ${t.category===c.id?'selected':''}>${c.icon} ${c.label}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label class="field-label">Subjects (comma separated)</label><input class="input" id="peSubjects" value="${(t.subjects||[]).join(', ')}" placeholder="Mathematics, Physics"/></div>
    <div class="field"><label class="field-label">Location</label><input class="input" id="peLocation" value="${t.location||''}" placeholder="Sector 45, Gurugram"/></div>
    <div class="field"><label class="field-label">Distance / area note (optional)</label><input class="input" id="peDistance" value="${t.distance||''}" placeholder="1.2 km"/></div>
    <div class="field"><label class="field-label">Experience</label><input class="input" id="peExperience" value="${t.experience||''}" placeholder="8 yrs"/></div>
    <div class="field"><label class="field-label">Monthly fee (₹)</label><input class="input" id="peFee" type="number" value="${t.fee_start||0}"/></div>
    <div class="field"><label class="field-label">Bio</label><textarea class="input" id="peBio" rows="3" placeholder="Tell parents about your teaching style...">${t.bio||''}</textarea></div>
    <div class="field">
      <label class="field-label">Weekly schedule — one slot per line, as <code>Day | Time | Subject</code></label>
      <textarea class="input" id="peSchedule" rows="3" placeholder="Mon | 4:00–5:00 PM | Mathematics
Wed | 4:00–5:00 PM | Mathematics">${(t.schedule_slots||[]).map(s=>`${s.day} | ${s.time} | ${s.subj}`).join('\n')}</textarea>
    </div>
    <button class="btn btn-primary" data-action="save-profile">Save changes</button>
  </div>`;
}

function viewTeacherDashboard(){
  if(!state.session || state.profile?.role!=='teacher') return viewTeacherAuth();
  if(teacherDataStatus!=='ready'){
    return `${navbar()}${teacherDataStatus==='error' ? errorScreen('dashboard') : loadingScreen('your dashboard')}`;
  }
  const tabMap = {overview:teacherOverview, students:teacherStudents, profile:teacherProfileEdit};
  return `
  ${navbar()}
  <div class="wrap view-transition" style="padding-top:32px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
      <div>
        <div class="eyebrow">Teacher dashboard</div>
        <h1 style="font-size:26px; margin-top:4px;">Welcome back, ${state.profile.full_name || 'there'} 👋</h1>
      </div>
    </div>
    <div class="dash-layout">
      <div>${teacherSidebar()}</div>
      <div>${tabMap[state.teacherTab]()}</div>
    </div>
  </div>`;
}

/* =========================================================
   MODALS
========================================================= */
let modalHTML = '';
function openModal(html){ modalHTML = html; renderModal(); }
function closeModal(){ modalHTML=''; renderModal(); }
function renderModal(){
  let root = document.getElementById('modalRoot');
  if(!root){ root = document.createElement('div'); root.id='modalRoot'; document.body.appendChild(root); }
  root.innerHTML = modalHTML ? `<div class="modal-backdrop" data-action="close-modal">${modalHTML}</div>` : '';
}

function enquiryModal(id){
  const t = TEACHERS.find(x=>x.id===id);
  return `<div class="glass modal" onclick="event.stopPropagation()">
    <h3 style="font-size:18px; margin-bottom:4px;">Enquire with ${t.name}</h3>
    <p class="muted" style="font-size:13px; margin-bottom:18px;">They'll see this in their dashboard.</p>
    <div class="field"><label class="field-label">Message</label><textarea class="input" id="enquiryMsg" rows="3">Hi ${t.name}, I'd like to know more about your ${t.subjects[0]||'classes'}.</textarea></div>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary btn-block" data-action="send-enquiry" data-id="${t.id}" data-name="${t.name}">Send enquiry</button>
    </div>
  </div>`;
}

function payModal(){
  const totalDue = myEnrollments.filter(e=>e.status!=='paid').reduce((s,e)=>s+e.fee,0);
  return `<div class="glass modal" onclick="event.stopPropagation()">
    <h3 style="font-size:18px; margin-bottom:4px;">Mark fees as paid</h3>
    <p class="muted" style="font-size:13px; margin-bottom:18px;">Total due across all enrollments. (This records the payment — it does not move real money.)</p>
    <div style="text-align:center; padding:20px 0;">
      <div style="font-family:var(--mono); font-size:36px; font-weight:700;">₹${totalDue}</div>
    </div>
    <div class="field">
      <label class="field-label">Payment method</label>
      <select class="input" id="payMethod">
        <option>UPI</option><option>Card</option><option>Netbanking</option><option>Cash</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" data-action="confirm-pay">Confirm ₹${totalDue} as paid</button>
  </div>`;
}

/* =========================================================
   RENDER + EVENTS
========================================================= */
function loadingScreen(what){
  return `<div class="wrap view-transition" style="padding-top:100px; text-align:center;">
    <div class="glass" style="padding:48px; max-width:420px; margin:0 auto;">
      <div style="font-size:28px;">⏳</div>
      <p class="muted" style="margin-top:12px;">Loading ${what||'teachers'}…</p>
    </div>
  </div>`;
}
function errorScreen(what){
  return `<div class="wrap view-transition" style="padding-top:100px; text-align:center;">
    <div class="glass" style="padding:48px; max-width:460px; margin:0 auto;">
      <div style="font-size:28px;">⚠️</div>
      <h3 style="margin-top:12px; font-size:17px;">Couldn't load ${what||'data'}</h3>
      <p class="muted" style="margin-top:6px; font-size:13.5px;">Check your connection and Supabase configuration, then try again.</p>
      <button class="btn btn-primary" style="margin-top:18px;" data-action="retry-load">Try again</button>
    </div>
  </div>`;
}

const NEEDS_TEACHERS = new Set(['home','browse','teacherProfile']);

function render(){
  if(!isConfigured()){ document.getElementById('app').innerHTML = setupMissingScreen(); return; }
  const views = {
    home: viewHome, browse: viewBrowse, teacherProfile: viewTeacherProfile,
    studentAuth: viewStudentAuth, studentDashboard: viewStudentDashboard,
    teacherHome: viewTeacherHome, teacherAuth: viewTeacherAuth, teacherDashboard: viewTeacherDashboard,
  };
  let html;
  if(NEEDS_TEACHERS.has(state.view) && teachersStatus !== 'ready'){
    html = navbar() + (teachersStatus === 'error' ? errorScreen('teachers') : loadingScreen('teachers'));
  }else{
    html = views[state.view]();
  }
  document.getElementById('app').innerHTML = html;
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'go-home':
      nav(state.portal==='customer' ? 'home' : 'teacherHome'); break;
    case 'go':
      nav(el.dataset.view); break;
    case 'switch-portal':
      state.portal = el.dataset.portal;
      nav(state.portal==='customer' ? 'home' : (state.session && state.profile?.role==='teacher' ? 'teacherDashboard' : 'teacherHome'));
      break;
    case 'filter-cat':
      state.filters.category = el.dataset.cat;
      nav('browse');
      break;
    case 'set-filter-cat':
      state.filters.category = el.dataset.cat;
      render();
      break;
    case 'search-from-hero':
      state.filters.query = document.getElementById('heroSearch').value;
      nav('browse');
      break;
    case 'view-teacher':
      nav('teacherProfile', {selectedTeacherId: el.dataset.id});
      break;
    case 'open-enquiry':
      if(!state.session || state.profile?.role!=='student'){ toast('Please log in as a parent/student first', 'warn'); nav('studentAuth'); return; }
      openModal(enquiryModal(el.dataset.id));
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'send-enquiry': {
      const msg = document.getElementById('enquiryMsg').value;
      sb.from('enquiries').insert({ teacher_id: el.dataset.id, student_id: state.session.user.id, message: msg })
        .then(({error})=>{
          if(error){ toast('❌ ' + error.message, 'err'); return; }
          closeModal();
          toast('✅ Enquiry sent to ' + el.dataset.name + '!', 'ok');
        });
      break;
    }
    case 'enroll-now': {
      const t = TEACHERS.find(x=>x.id===el.dataset.id);
      if(!state.session || state.profile?.role!=='student'){ toast('Please log in as a parent/student first', 'warn'); nav('studentAuth'); return; }
      sb.from('enrollments').insert({
        student_id: state.session.user.id, teacher_id: t.id, subject: t.subjects[0]||'General',
        schedule: (t.schedule[0] ? `${t.schedule[0].day} ${t.schedule[0].time}` : ''), fee: t.feeStart, status:'due',
      }).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        toast('✅ Enrolled with ' + t.name + '!', 'ok');
        studentDataStatus = 'idle';
        nav('studentDashboard');
      });
      break;
    }
    case 'student-auth-mode':
      state.studentAuthMode = el.dataset.mode; render(); break;
    case 'teacher-auth-mode':
      state.teacherAuthMode = el.dataset.mode; render(); break;
    case 'login-student':
      signInStudent(document.getElementById('suEmail').value, document.getElementById('suPassword').value);
      break;
    case 'signup-student':
      signUpStudent(document.getElementById('suName').value, document.getElementById('suEmail').value, document.getElementById('suPassword').value);
      break;
    case 'login-teacher':
      signInTeacher(document.getElementById('tuEmail').value, document.getElementById('tuPassword').value);
      break;
    case 'signup-teacher':
      signUpTeacher(document.getElementById('tuName').value, document.getElementById('tuEmail').value, document.getElementById('tuPassword').value);
      break;
    case 'logout':
      logout();
      break;
    case 'teacher-tab':
      state.teacherTab = el.dataset.tab;
      if(el.dataset.tab==='profile') loadOwnTeacherProfile();
      else render();
      break;
    case 'copy-profile-link': {
      const link = location.origin + location.pathname + '?teacher=' + state.session.user.id;
      navigator.clipboard.writeText(link).then(()=>toast('🔗 Link copied to clipboard', 'ok'));
      break;
    }
    case 'save-profile':
      saveTeacherProfile();
      break;
    case 'open-pay':
      openModal(payModal());
      break;
    case 'confirm-pay':
      confirmPay(document.getElementById('payMethod').value);
      break;
    case 'retry-load':
      ensureTeachers(true);
      if(state.view==='studentDashboard') ensureStudentData(true);
      if(state.view==='teacherDashboard') ensureTeacherData(true);
      break;
  }
});

async function loadOwnTeacherProfile(){
  const { data, error } = await sb.from('teacher_profiles').select('*, schedule_slots(day,time,subj)').eq('profile_id', state.session.user.id).single();
  if(error){ toast('❌ ' + error.message, 'err'); return; }
  state.selectedTeacherProfile = data;
  render();
}

async function saveTeacherProfile(){
  const uid = state.session.user.id;
  const payload = {
    category: document.getElementById('peCategory').value,
    subjects: document.getElementById('peSubjects').value.split(',').map(s=>s.trim()).filter(Boolean),
    location: document.getElementById('peLocation').value,
    distance: document.getElementById('peDistance').value,
    experience: document.getElementById('peExperience').value,
    fee_start: parseInt(document.getElementById('peFee').value) || 0,
    bio: document.getElementById('peBio').value,
  };
  const { error } = await sb.from('teacher_profiles').update(payload).eq('profile_id', uid);
  if(error){ toast('❌ ' + error.message, 'err'); return; }

  const scheduleLines = document.getElementById('peSchedule').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const slots = scheduleLines.map(l=>{
    const [day,time,subj] = l.split('|').map(s=>s.trim());
    return { teacher_id: uid, day, time, subj };
  }).filter(s=>s.day && s.time && s.subj);
  await sb.from('schedule_slots').delete().eq('teacher_id', uid);
  if(slots.length) await sb.from('schedule_slots').insert(slots);

  toast('✅ Profile updated', 'ok');
  ensureTeachers(true);
  loadOwnTeacherProfile();
}

async function confirmPay(method){
  const due = myEnrollments.filter(e=>e.status!=='paid');
  const total = due.reduce((s,e)=>s+e.fee,0);
  for(const e of due){
    await sb.from('enrollments').update({status:'paid'}).eq('id', e.id);
    await sb.from('payments').insert({ enrollment_id:e.id, student_id: state.session.user.id, amount:e.fee, method });
  }
  closeModal();
  toast('✅ Recorded ₹' + total + ' as paid.', 'ok');
  studentDataStatus = 'idle';
  ensureStudentData(true);
}

boot();
</script>
</body>
</html>
